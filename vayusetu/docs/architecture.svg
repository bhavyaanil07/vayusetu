<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .t { fill:#0b0b0b; font-size:15px; font-weight:650; }
      .s { fill:#52514e; font-size:12.5px; }
      .h { fill:#0b0b0b; font-size:13px; font-weight:700; letter-spacing:.06em; }
      .box { fill:#ffffff; stroke:#d9d8d1; stroke-width:1.2; }
      .ln { stroke:#52514e; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    </style>
  </defs>
  <rect x="0" y="0" width="1280" height="700" fill="#fcfcfb"/>

  <!-- column headers -->
  <text x="30" y="40" class="h">DATA SOURCES</text>
  <text x="330" y="40" class="h">CITY / STATE NODE (runs locally, keeps its data)</text>
  <text x="980" y="40" class="h">WHO ACTS ON IT</text>

  <!-- data sources -->
  <g>
    <rect x="30" y="60" width="250" height="78" rx="12" class="box"/><rect x="30" y="60" width="6" height="78" rx="3" fill="#2a78d6"/>
    <text x="48" y="88" class="t">Citizen sensors</text>
    <text x="48" y="108" class="s">~1 low-cost PM2.5 node per ward;</text>
    <text x="48" y="125" class="s">multi-gas (CO/NO2) at 30%</text>

    <rect x="30" y="150" width="250" height="78" rx="12" class="box"/><rect x="30" y="150" width="6" height="78" rx="3" fill="#2a78d6"/>
    <text x="48" y="178" class="t">Citizen photo reports</text>
    <text x="48" y="198" class="s">geotagged photos of smoke, dust,</text>
    <text x="48" y="215" class="s">burning; auto haze analysis</text>

    <rect x="30" y="240" width="250" height="78" rx="12" class="box"/><rect x="30" y="240" width="6" height="78" rx="3" fill="#2a78d6"/>
    <text x="48" y="268" class="t">CPCB stations</text>
    <text x="48" y="288" class="s">reference-grade CAAQMS, hourly</text>
    <text x="48" y="305" class="s">(data.gov.in real-time API)</text>

    <rect x="30" y="330" width="250" height="96" rx="12" class="box"/><rect x="30" y="330" width="6" height="96" rx="3" fill="#2a78d6"/>
    <text x="48" y="358" class="t">Satellites</text>
    <text x="48" y="378" class="s">NASA FIRMS VIIRS fires (375 m)</text>
    <text x="48" y="395" class="s">NASA GIBS true-colour / aerosol</text>
    <text x="48" y="412" class="s">Copernicus CAMS (assimilated)</text>

    <rect x="30" y="438" width="250" height="78" rx="12" class="box"/><rect x="30" y="438" width="6" height="78" rx="3" fill="#2a78d6"/>
    <text x="48" y="466" class="t">Meteorology</text>
    <text x="48" y="486" class="s">wind, humidity, temperature,</text>
    <text x="48" y="503" class="s">rain - observed + 3-day forecast</text>
  </g>

  <!-- node -->
  <rect x="320" y="55" width="620" height="470" rx="16" fill="#f3f7fc" stroke="#b7d3f6" stroke-width="1.4"/>
  <rect x="345" y="75" width="570" height="58" rx="10" class="box"/>
  <text x="365" y="100" class="t">Ingestion · quality control · calibration · data fusion</text>
  <text x="365" y="120" class="s">sensor QC · humidity correction · learned baselines · CAMS↔CPCB nudging</text>

  <rect x="345" y="150" width="180" height="150" rx="10" class="box"/><rect x="345" y="150" width="180" height="6" rx="3" fill="#eb6834"/>
  <text x="360" y="180" class="t">Hotspot engine</text>
  <text x="360" y="200" class="s">local background</text>
  <text x="360" y="217" class="s">Getis-Ord Gi* + DBSCAN</text>
  <text x="360" y="234" class="s">source attribution:</text>
  <text x="360" y="251" class="s">PM ratio, CO/NO2, time,</text>
  <text x="360" y="268" class="s">photos, fires, sites</text>
  <text x="360" y="287" class="s" font-weight="600" fill="#0b0b0b">97% recall (simulated)</text>

  <rect x="540" y="150" width="180" height="150" rx="10" class="box"/><rect x="540" y="150" width="180" height="6" rx="3" fill="#eb6834"/>
  <text x="555" y="180" class="t">VayuCast forecast</text>
  <text x="555" y="200" class="s">1-72 h, quantile GBM</text>
  <text x="555" y="217" class="s">calibrated 80% ranges</text>
  <text x="555" y="234" class="s">regional transport</text>
  <text x="555" y="251" class="s">+ CAMS physics blend</text>
  <text x="555" y="268" class="s">spike probabilities</text>
  <text x="555" y="287" class="s" font-weight="600" fill="#0b0b0b">9-11% less error</text>

  <rect x="735" y="150" width="180" height="150" rx="10" class="box"/><rect x="735" y="150" width="180" height="6" rx="3" fill="#eb6834"/>
  <text x="750" y="180" class="t">Photo analysis</text>
  <text x="750" y="200" class="s">dark channel prior</text>
  <text x="750" y="217" class="s">haze, smoke, fire, dust</text>
  <text x="750" y="234" class="s">EXIF GPS &amp; time</text>
  <text x="750" y="251" class="s">credibility scoring</text>
  <text x="750" y="268" class="s">vs. nearby sensors</text>
  <text x="750" y="287" class="s" font-weight="600" fill="#0b0b0b">runs on any laptop</text>

  <rect x="345" y="318" width="570" height="78" rx="10" class="box"/><rect x="345" y="318" width="6" height="78" rx="3" fill="#d03b3b"/>
  <text x="365" y="345" class="t">Alert engine</text>
  <text x="365" y="365" class="s">rules → level (Advisory / Warning / Emergency) → route to the responsible authority</text>
  <text x="365" y="382" class="s">GRAP stage guidance for Delhi-NCR · CAP 1.2 export · webhook / SMS / e-mail dispatch</text>

  <rect x="345" y="412" width="570" height="96" rx="10" class="box"/><rect x="345" y="412" width="6" height="96" rx="3" fill="#1baf7a"/>
  <text x="365" y="439" class="t">Federated learning client</text>
  <text x="365" y="459" class="s">trains the shared model on local data; sends only weights and feature sums</text>
  <text x="365" y="476" class="s">optional differential-privacy clipping + noise · fine-tunes the global model locally</text>
  <text x="365" y="493" class="s">model cards · open schemas · REST API (JSON, GeoJSON, CAP)</text>

  <!-- hub -->
  <rect x="420" y="570" width="420" height="100" rx="14" fill="#eefaf5" stroke="#1baf7a" stroke-width="1.4"/>
  <text x="440" y="600" class="t">Federation hub (national / CPCB)</text>
  <text x="440" y="620" class="s">FedAvg aggregation · federated normalisation</text>
  <text x="440" y="637" class="s">model registry &amp; cards · versioned releases to all cities</text>
  <text x="440" y="654" class="s">19 cities trained together: -9% error vs. training alone</text>

  <!-- outputs -->
  <g>
    <rect x="980" y="60" width="270" height="78" rx="12" class="box"/><rect x="980" y="60" width="6" height="78" rx="3" fill="#52514e"/>
    <text x="998" y="88" class="t">City &amp; state control rooms</text>
    <text x="998" y="108" class="s">command centre, hotspot radar,</text>
    <text x="998" y="125" class="s">72-h corridor outlook</text>

    <rect x="980" y="150" width="270" height="96" rx="12" class="box"/><rect x="980" y="150" width="6" height="96" rx="3" fill="#52514e"/>
    <text x="998" y="178" class="t">Field responders</text>
    <text x="998" y="198" class="s">SPCB flying squads, municipal</text>
    <text x="998" y="215" class="s">sanitation &amp; C&amp;D cells, fire</text>
    <text x="998" y="232" class="s">services, traffic police</text>

    <rect x="980" y="258" width="270" height="78" rx="12" class="box"/><rect x="980" y="258" width="6" height="78" rx="3" fill="#52514e"/>
    <text x="998" y="286" class="t">CAQM · SDMA · SACHET</text>
    <text x="998" y="306" class="s">GRAP invocation, public</text>
    <text x="998" y="323" class="s">health alerts via CAP 1.2</text>

    <rect x="980" y="348" width="270" height="78" rx="12" class="box"/><rect x="980" y="348" width="6" height="78" rx="3" fill="#52514e"/>
    <text x="998" y="376" class="t">Agriculture departments</text>
    <text x="998" y="396" class="s">crop-residue teams sent to</text>
    <text x="998" y="413" class="s">upwind fire clusters</text>

    <rect x="980" y="438" width="270" height="78" rx="12" class="box"/><rect x="980" y="438" width="6" height="78" rx="3" fill="#52514e"/>
    <text x="998" y="466" class="t">Citizens &amp; researchers</text>
    <text x="998" y="486" class="s">health advisories, open data</text>
    <text x="998" y="503" class="s">and API access</text>
  </g>

  <!-- arrows -->
  <path d="M280 99 C 305 99, 315 104, 343 104" class="ln"/>
  <path d="M280 189 C 305 189, 315 110, 343 108" class="ln"/>
  <path d="M280 279 C 305 279, 318 116, 343 112" class="ln"/>
  <path d="M280 378 C 308 378, 320 122, 343 118" class="ln"/>
  <path d="M280 477 C 310 477, 322 126, 343 124" class="ln"/>
  <path d="M630 525 L 630 568" class="ln"/>
  <path d="M600 568 L 600 527" class="ln"/>
  <text x="640" y="552" class="s">weights ↑↓</text>
  <path d="M915 357 C 945 357, 950 99, 978 99" class="ln"/>
  <path d="M915 357 C 945 357, 950 198, 978 198" class="ln"/>
  <path d="M915 357 C 948 357, 952 297, 978 297" class="ln"/>
  <path d="M915 357 C 948 357, 952 387, 978 387" class="ln"/>
  <path d="M915 357 C 945 357, 950 477, 978 477" class="ln"/>
</svg>
